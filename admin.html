<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RLCS HUB - لوحة التحكم الإدارية (Admin Panel)</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background-color: #0e131f;
            color: #ffffff;
            min-height: 100vh;
            padding: 30px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(145deg, #151d30, #0a0f1c);
            padding: 25px 40px;
            border-radius: 20px;
            border: 2px solid #ff007f;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.3);
            margin-bottom: 40px;
        }
        .admin-header h1 {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(45deg, #ff007f, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .back-site-btn {
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            color: #030508;
            padding: 10px 22px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 900;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            transition: 0.3s;
        }
        .back-site-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
        }

        /* الإحصائيات السريعة */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: linear-gradient(145deg, #151d30, #0a0f1c);
            border: 2px solid #1f2b48;
            padding: 25px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .stat-card h3 {
            color: #8b9bb4;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .stat-card span {
            font-size: 32px;
            font-weight: 900;
            color: #00f0ff;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
        }

        /* جدول المشتركين */
        .table-container {
            background: linear-gradient(145deg, #151d30, #0a0f1c);
            border: 2px solid #1f2b48;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            overflow-x: auto;
        }
        .table-title {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 25px;
            color: #fff;
            border-right: 5px solid #ff007f;
            padding-right: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }
        th, td {
            padding: 16px;
            border-bottom: 1px solid #1f2b48;
            font-size: 15px;
        }
        th {
            color: #00f0ff;
            font-weight: 900;
            background-color: rgba(0, 240, 255, 0.05);
        }
        td {
            color: #c3cadf;
            font-weight: 700;
        }
        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }
        .no-data {
            text-align: center;
            padding: 40px;
            color: #8b9bb4;
            font-size: 18px;
            font-weight: 700;
        }
        .clear-btn {
            background: linear-gradient(135deg, #ff007f, #ff3366);
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            transition: 0.3s;
        }
        .clear-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.8);
        }
    </style>
</head>
<body>

    <div class="admin-header">
        <h1>لوحة تحكم الأدمن - RLCS HUB</h1>
        <a href="index.html" class="back-site-btn">العودة للموقع الرئيسي</a>
    </div>

    <!-- الإحصائيات -->
    <div class="stats-grid">
        <div class="stat-card">
            <h3>إجمالي الفرق المسجلة</h3>
            <span id="totalTeams">0</span>
        </div>
        <div class="stat-card">
            <h3>طريقة الدفع المعتمدة</h3>
            <span style="font-size: 18px; color: #ff6600;">أورانج ماني (0779641915)</span>
        </div>
    </div>

    <!-- جدول الطلبات -->
    <div class="table-container">
        <div class="table-title">سجل الفرق واللاعبين المتقدمين للبطولات</div>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>اسم البطوله</th>
                    <th>اسم الفريق</th>
                    <th>الاسم الكامل</th>
                    <th>العمر</th>
                    <th>الرانك</th>
                    <th>الديسكورد</th>
                    <th>طريقة الدفع</th>
                    <th>التاريخ</th>
                </tr>
            </thead>
            <tbody id="adminTableBody">
                <!-- سيتم تعبئة البيانات تلقائياً هنا -->
            </tbody>
        </table>
        <div id="emptyMessage" class="no-data" style="display: none;">لا توجد أي تسجيلا لغاية الآن.</div>
        
        <button class="clear-btn" onclick="clearRegistrations()">حذف جميع سجلات التسجيل</button>
    </div>

    <script>
        function loadAdminData() {
            let teams = JSON.parse(localStorage.getItem('rlcs_global_teams')) || [];
            const tbody = document.getElementById('adminTableBody');
            const emptyMsg = document.getElementById('emptyMessage');
            const totalTeamsSpan = document.getElementById('totalTeams');

            totalTeamsSpan.textContent = teams.length;
            tbody.innerHTML = '';

            if(teams.length === 0) {
                emptyMsg.style.display = 'block';
                return;
            } else {
                emptyMsg.style.display = 'none';
            }

            teams.forEach((team, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td style="color: #00f0ff; font-weight: 900;">${team.tournament}</td>
                    <td style="color: #fff; font-weight: 900;">${team.teamName}</td>
                    <td>${team.fullName}</td>
                    <td>${team.age} سنة</td>
                    <td><span style="background: rgba(255,0,127,0.1); padding: 4px 10px; border-radius: 8px; color: #ff007f;">${team.rank}</span></td>
                    <td>${team.discord}</td>
                    <td style="color: #ff6600; font-weight: 900;">${team.payment}</td>
                    <td>${team.date}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function clearRegistrations() {
            if(confirm('هل أنت متأكد من رغبتك في مسح كافة سجلات التسجيل؟')) {
                localStorage.removeItem('rlcs_global_teams');
                loadAdminData();
                alert('تم تفريغ كافة السجلات بنجاح.');
            }
        }

        window.onload = loadAdminData;
    </script>
</body>
</html>
